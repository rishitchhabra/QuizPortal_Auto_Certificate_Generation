<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Gyan's Quiz Arena — Interactive online quizzes, assessments and auto-generated certificates for students." />
  <meta name="theme-color" content="#F8FAFF" />
  <title>Gyan's Quiz Arena — Assessments &amp; Certificates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Nunito+Sans:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/logo.png">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- API server base URL: empty means same-origin (Express serves both frontend + API) -->
  <script>
    // In production, leave empty — Express serves the built frontend AND the API on the same port.
    // During Vite dev, the vite.config.js proxy handles /api/* routing to localhost:3001.
    window.SERVER_BASE = window.SERVER_BASE || '';
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
